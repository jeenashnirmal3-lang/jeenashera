<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Your Cart | Jeenash Store - Premium Digital Products</title>
    
    <!-- SEO & Meta Tags -->
    <meta name="description" content="View and checkout your selected premium digital products at Jeenash Store. Instant access to reels bundles, ebooks, and courses.">
    <meta name="robots" content="noindex, nofollow">
    
    <!-- OpenGraph Tags -->
    <meta property="og:title" content="Your Cart | Jeenash Store">
    <meta property="og:description" content="Review your selected digital products and complete your purchase securely.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://jeenashera.online/store/cart.html">
    
    <!-- Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" type="image/x-icon" href="/store/assets/favicon.ico">
    
    <!-- Stylesheets — ABSOLUTE PATH -->
    <link rel="stylesheet" href="/store/css/style.css">
    
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-H0SWB77LDL"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-H0SWB77LDL');
    </script>
    
    <style>
        .cart-page-section {
            padding: 140px 0 80px 0;
            min-height: 100vh;
        }
        
        .cart-header {
            margin-bottom: 2rem;
            padding-bottom: 1.5rem;
            border-bottom: 1px solid var(--border-glass);
        }
        
        .cart-header h1 {
            font-size: clamp(1.8rem, 3vw, 2.5rem);
            font-weight: 800;
            font-family: var(--font-heading);
            letter-spacing: -0.02em;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }
        
        .cart-header h1 i {
            color: var(--gold);
        }
        
        .cart-header p {
            color: var(--text-muted);
            font-size: 1rem;
            margin-top: 0.25rem;
        }
        
        .cart-layout {
            display: grid;
            grid-template-columns: 1fr 380px;
            gap: 2rem;
            align-items: start;
        }
        
        .cart-items {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        
        .cart-item {
            display: grid;
            grid-template-columns: 120px 1fr auto;
            gap: 1.25rem;
            background: var(--bg-elevated);
            border: 1px solid var(--border-glass);
            border-radius: var(--radius-md);
            padding: 1rem;
            transition: var(--transition-smooth);
            align-items: center;
        }
        
        .cart-item:hover {
            border-color: rgba(139, 92, 246, 0.2);
            box-shadow: var(--shadow-sm);
        }
        
        .cart-item-image {
            width: 120px;
            height: 90px;
            border-radius: var(--radius-sm);
            overflow: hidden;
            background: var(--bg-base);
            flex-shrink: 0;
        }
        
        .cart-item-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .cart-item-info {
            display: flex;
            flex-direction: column;
            gap: 0.35rem;
            min-width: 0;
        }
        
        .cart-item-category {
            font-size: 0.6rem;
            color: var(--primary-light);
            text-transform: uppercase;
            letter-spacing: 0.8px;
            font-weight: 600;
        }
        
        .cart-item-title {
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-main);
            line-height: 1.3;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            font-family: var(--font-body);
        }
        
        .cart-item-price {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--gold);
            font-family: var(--font-heading);
        }
        
        .cart-item-actions {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            align-items: flex-end;
        }
        
        .cart-item-remove {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.2);
            color: var(--accent-red);
            width: 38px;
            height: 38px;
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: var(--transition-fast);
            font-size: 0.9rem;
        }
        
        .cart-item-remove:hover {
            background: rgba(239, 68, 68, 0.2);
            transform: scale(1.05);
        }
        
        .order-summary {
            background: var(--bg-elevated);
            border: 1px solid var(--border-glass);
            border-radius: var(--radius-md);
            padding: 1.75rem;
            position: sticky;
            top: 100px;
        }
        
        .order-summary h3 {
            font-size: 1.2rem;
            font-weight: 700;
            font-family: var(--font-heading);
            margin-bottom: 1.25rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--border-glass);
        }
        
        .summary-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.6rem 0;
            color: var(--text-muted);
            font-size: 0.95rem;
        }
        
        .summary-row.total {
            padding-top: 1rem;
            margin-top: 0.5rem;
            border-top: 1px solid var(--border-glass);
            color: var(--text-main);
            font-size: 1.25rem;
            font-weight: 700;
            font-family: var(--font-heading);
        }
        
        .summary-row.total .total-price {
            color: var(--gold);
            font-size: 1.5rem;
        }
        
        .summary-row .value {
            color: var(--text-main);
            font-weight: 600;
        }
        
        .checkout-btn {
            width: 100%;
            margin-top: 1.5rem;
            padding: 1rem;
            font-size: 1rem;
            font-weight: 700;
            border-radius: var(--radius-sm);
            background: var(--gold-gradient);
            color: #000;
            border: none;
            cursor: pointer;
            transition: var(--transition-smooth);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            min-height: 54px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .checkout-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(255, 215, 0, 0.25);
        }
        
        .checkout-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        
        .clear-cart-btn {
            width: 100%;
            margin-top: 0.75rem;
            padding: 0.75rem;
            background: rgba(239, 68, 68, 0.08);
            border: 1px solid rgba(239, 68, 68, 0.15);
            color: var(--accent-red);
            border-radius: var(--radius-sm);
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition-fast);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            min-height: 44px;
        }
        
        .clear-cart-btn:hover {
            background: rgba(239, 68, 68, 0.15);
        }
        
        .secure-info {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            color: var(--text-muted);
            font-size: 0.75rem;
            margin-top: 1rem;
        }
        
        .secure-info i {
            color: var(--accent-green);
        }
        
        .empty-cart {
            text-align: center;
            padding: 5rem 2rem;
            background: rgba(255, 255, 255, 0.02);
            border: 1px dashed var(--border-glass);
            border-radius: var(--radius-lg);
            max-width: 600px;
            margin: 0 auto;
        }
        
        .empty-cart .empty-icon {
            font-size: 4rem;
            color: var(--text-muted);
            margin-bottom: 1.5rem;
            opacity: 0.5;
        }
        
        .empty-cart h2 {
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
            font-family: var(--font-heading);
        }
        
        .empty-cart p {
            color: var(--text-muted);
            margin-bottom: 2rem;
        }
        
        .cart-indicator {
            color: var(--text-muted);
            font-size: 1.2rem;
            position: relative;
            display: none;
            transition: var(--transition-fast);
            cursor: pointer;
            text-decoration: none;
        }
        
        .cart-indicator:hover {
            color: var(--gold);
        }
        
        .cart-badge {
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 20px;
            height: 20px;
            background: var(--accent-red);
            color: #fff;
            font-size: 0.6rem;
            font-weight: 700;
            border-radius: 50%;
            padding: 0 5px;
            margin-left: 2px;
            vertical-align: top;
            top: -8px;
        }
        
        @media (max-width: 992px) {
            .cart-layout {
                grid-template-columns: 1fr;
            }
            
            .order-summary {
                position: static;
            }
        }
        
        @media (max-width: 768px) {
            .cart-page-section {
                padding: 110px 0 40px 0;
            }
            
            .cart-header h1 {
                font-size: 1.5rem;
            }
            
            .cart-header p {
                font-size: 0.85rem;
            }
            
            .cart-item {
                grid-template-columns: 90px 1fr;
                gap: 0.75rem;
                padding: 0.75rem;
            }
            
            .cart-item-image {
                width: 90px;
                height: 70px;
            }
            
            .cart-item-title {
                font-size: 0.85rem;
            }
            
            .cart-item-price {
                font-size: 0.95rem;
            }
            
            .cart-item-actions {
                grid-column: 1 / -1;
                flex-direction: row;
                justify-content: flex-end;
            }
            
            .cart-item-remove {
                width: 34px;
                height: 34px;
            }
            
            .order-summary {
                padding: 1.25rem;
            }
        }
        
        @media (max-width: 480px) {
            .cart-item {
                grid-template-columns: 80px 1fr;
                padding: 0.6rem;
            }
            
            .cart-item-image {
                width: 80px;
                height: 60px;
            }
            
            .cart-item-title {
                font-size: 0.75rem;
            }
            
            .cart-item-price {
                font-size: 0.85rem;
            }
            
            .empty-cart {
                padding: 3rem 1.5rem;
            }
            
            .empty-cart .empty-icon {
                font-size: 3rem;
            }
            
            .empty-cart h2 {
                font-size: 1.2rem;
            }
        }
        
        @media (prefers-reduced-motion: reduce) {
            .cart-item,
            .checkout-btn,
            .cart-item-remove {
                transition: none !important;
            }
        }
    </style>
</head>
<body>
    <div class="bg-shape shape-1" style="opacity: 0.15;" aria-hidden="true"></div>
    <div class="bg-shape shape-3" style="opacity: 0.1;" aria-hidden="true"></div>

    <!-- Navigation -->
    <header class="glass-nav" role="banner">
        <div class="container nav-container">
            <a href="/store/index.html" class="brand-logo" aria-label="Jeenash Store Home">
                <span class="logo-icon"><i class="fa-solid fa-layer-group"></i></span>
                <span class="logo-text">JEENASH<span class="text-primary">STORE</span></span>
            </a>
            <div style="display: flex; align-items: center; gap: 1rem;">
                <a href="/store/cart.html" class="cart-indicator" id="cart-indicator" aria-label="View cart" style="display: inline-flex; color: var(--gold);">
                    <i class="fa-solid fa-cart-shopping"></i>
                    <span class="cart-badge" id="cart-count-badge">0</span>
                </a>
                <button class="mobile-menu-toggle" aria-label="Toggle Menu" aria-expanded="false" aria-controls="main-nav">
                    <i class="fa-solid fa-bars"></i>
                </button>
            </div>
            <nav id="main-nav" class="main-navigation" role="navigation">
                <ul class="nav-links">
                    <li><a href="/store/index.html" class="nav-link">Home</a></li>
                    <li><a href="/store/explore.html" class="nav-link">Explore</a></li>
                </ul>
                <div class="nav-actions">
                    <div id="auth-state-container" class="auth-state">
                        <div class="skeleton-loader skeleton-btn" aria-hidden="true"></div>
                    </div>
                </div>
            </nav>
        </div>
    </header>

    <!-- Cart Section -->
    <main class="cart-page-section" role="main">
        <div class="container">
            <div class="cart-header">
                <h1><i class="fa-solid fa-cart-shopping"></i> Your Cart</h1>
                <p id="cart-subtitle">Review your selected items before checkout</p>
            </div>

            <div id="cart-content">
                <!-- Rendered by JS -->
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="site-footer" style="padding: 3rem 0 2rem 0; text-align: center; border-top: 1px solid rgba(255,255,255,0.05); margin-top: auto;" role="contentinfo">
        <div class="container">
            <p>&copy; <span id="current-year"></span> Jeenash Store. Global Digital Marketplace.</p>
        </div>
    </footer>

    <!-- Firebase & Scripts — ABSOLUTE PATHS -->
    <script type="module" src="/store/config/firebase.js"></script>
    <script type="module" src="/store/js/app.js"></script>
    <script type="module" src="/store/js/auth.js"></script>
    
    <!-- Cart Logic -->
    <script type="module">
        import { showToast } from '/store/js/app.js';
        
        const CART_KEY = 'jeenash_cart';
        
        function getCart() {
            try { return JSON.parse(localStorage.getItem(CART_KEY)) || []; }
            catch { return []; }
        }
        
        function saveCart(cart) {
            localStorage.setItem(CART_KEY, JSON.stringify(cart));
            updateCartIndicator();
        }
        
        function updateCartIndicator() {
            const badge = document.getElementById('cart-count-badge');
            if (!badge) return;
            const count = getCart().length;
            badge.textContent = count;
            badge.style.display = count > 0 ? 'inline-flex' : 'none';
        }
        
        function removeItem(productId) {
            const cart = getCart();
            const filtered = cart.filter(item => item.id !== productId);
            saveCart(filtered);
            showToast('Removed from cart', 'info');
            renderCart();
        }
        
        function clearCart() {
            if (!confirm('Remove all items from cart?')) return;
            localStorage.removeItem(CART_KEY);
            updateCartIndicator();
            showToast('Cart cleared', 'info');
            renderCart();
        }
        
        function renderCart() {
            const container = document.getElementById('cart-content');
            const subtitle = document.getElementById('cart-subtitle');
            if (!container) return;
            
            const cart = getCart();
            
            if (cart.length === 0) {
                subtitle.textContent = 'Your cart is waiting to be filled';
                container.innerHTML = `
                    <div class="empty-cart">
                        <div class="empty-icon"><i class="fa-solid fa-cart-shopping"></i></div>
                        <h2>Your cart is empty</h2>
                        <p>Looks like you haven't added anything yet.</p>
                        <a href="/store/explore.html" class="btn btn-primary btn-lg" style="border-radius: 50px;">
                            <i class="fa-solid fa-compass"></i> Explore Products
                        </a>
                    </div>
                `;
                return;
            }
            
            const total = cart.reduce((sum, item) => sum + (Number(item.price) || 0), 0);
            
            subtitle.textContent = `${cart.length} item${cart.length > 1 ? 's' : ''} in your cart`;
            
            let itemsHtml = '';
            cart.forEach(item => {
                const priceDisplay = Number(item.price) === 0 ? 'Free' : `₹${item.price}`;
                itemsHtml += `
                    <div class="cart-item" data-id="${item.id}">
                        <div class="cart-item-image">
                            <img src="${item.image || '/store/assets/images/placeholder.jpg'}" alt="${item.title || 'Product'}" onerror="this.src='/store/assets/images/placeholder.jpg'">
                        </div>
                        <div class="cart-item-info">
                            <span class="cart-item-category">${item.category || 'Product'}</span>
                            <span class="cart-item-title">${item.title || 'Untitled'}</span>
                            <span class="cart-item-price">${priceDisplay}</span>
                        </div>
                        <div class="cart-item-actions">
                            <button class="cart-item-remove" data-id="${item.id}" aria-label="Remove ${item.title || 'item'} from cart">
                                <i class="fa-solid fa-trash"></i>
                            </button>
                        </div>
                    </div>
                `;
            });
            
            const totalDisplay = total === 0 ? 'Free' : `₹${total}`;
            
            container.innerHTML = `
                <div class="cart-layout">
                    <div class="cart-items">
                        ${itemsHtml}
                    </div>
                    <div class="order-summary">
                        <h3>Order Summary</h3>
                        <div class="summary-row">
                            <span>Items</span>
                            <span class="value">${cart.length}</span>
                        </div>
                        <div class="summary-row">
                            <span>Subtotal</span>
                            <span class="value">${totalDisplay}</span>
                        </div>
                        <div class="summary-row total">
                            <span>Total</span>
                            <span class="total-price">${totalDisplay}</span>
                        </div>
                        
                        <button class="checkout-btn" id="checkout-btn">
                            <i class="fa-solid fa-bolt"></i> Proceed to Checkout
                        </button>
                        <button class="clear-cart-btn" id="clear-cart-btn">
                            <i class="fa-solid fa-trash"></i> Clear Cart
                        </button>
                        
                        <div class="secure-info">
                            <i class="fa-solid fa-shield-halved"></i>
                            <span>256-bit Secure Razorpay Checkout</span>
                        </div>
                    </div>
                </div>
            `;
            
            container.querySelectorAll('.cart-item-remove').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.preventDefault();
                    const id = e.currentTarget.dataset.id;
                    removeItem(id);
                });
            });
            
            const clearBtn = document.getElementById('clear-cart-btn');
            if (clearBtn) clearBtn.addEventListener('click', clearCart);
            
            const checkoutBtn = document.getElementById('checkout-btn');
            if (checkoutBtn) {
                checkoutBtn.addEventListener('click', () => {
                    const cart = getCart();
                    if (cart.length === 0) return;
                    
                    if (cart.length === 1) {
                        window.location.href = `/store/product.html?id=${cart[0].id}`;
                    } else {
                        showToast('Please buy items one at a time. Redirecting to first item...', 'info');
                        setTimeout(() => {
                            window.location.href = `/store/product.html?id=${cart[0].id}`;
                        }, 1200);
                    }
                });
            }
        }
        
        document.addEventListener('DOMContentLoaded', () => {
            updateCartIndicator();
            renderCart();
            
            const yearEl = document.getElementById('current-year');
            if (yearEl) yearEl.textContent = new Date().getFullYear();
        });
        
        console.log('✅ Cart page loaded');
    </script>
</body>
</html>
