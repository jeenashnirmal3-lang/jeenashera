    <!-- Cart & Wishlist Styles -->
    <style>
        .cart-badge {
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 20px;
            height: 20px;
            background: var(--accent-red, #ef4444);
            color: #fff;
            font-size: 0.55rem;
            font-weight: 700;
            border-radius: 50%;
            padding: 0 5px;
            margin-left: 2px;
            vertical-align: top;
            top: -8px;
        }
        .cart-indicator {
            color: var(--text-muted);
            font-size: 1.2rem;
            position: relative;
            display: none;
            transition: var(--transition-fast);
            cursor: pointer;
            text-decoration: none;
        }
        .cart-indicator:hover {
            color: var(--gold);
        }
        .cart-indicator .cart-badge {
            display: none;
        }
        
        .card-wishlist-btn {
            position: absolute;
            top: 0.6rem;
            right: 0.6rem;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 50%;
            width: 34px;
            height: 34px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: var(--transition-fast);
            z-index: 3;
            color: #fff;
            font-size: 0.9rem;
        }
        .card-wishlist-btn:hover {
            transform: scale(1.1);
            background: rgba(0,0,0,0.7);
        }
        .card-wishlist-btn.active {
            color: #ef4444;
        }
        .card-wishlist-btn.active i {
            color: #ef4444;
        }
        
        .card-cart-btn {
            padding: 0.4rem 0.5rem;
            font-size: 0.6rem;
            border-radius: var(--radius-sm);
            min-height: 32px;
            border: 1px solid var(--border-glass);
            background: rgba(255,255,255,0.04);
            color: var(--text-muted);
            cursor: pointer;
            transition: var(--transition-fast);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.3rem;
            width: 100%;
        }
        .card-cart-btn:hover:not(:disabled) {
            background: rgba(255,255,255,0.08);
            color: var(--text-main);
        }
        .card-cart-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .card-cart-btn.added {
            background: rgba(16,185,129,0.15);
            color: #34d399;
            border-color: rgba(16,185,129,0.3);
        }
        
        .product-card {
            position: relative;
        }
        
        .product-footer .btn-group {
            display: flex;
            gap: 0.4rem;
            width: 100%;
        }
        .product-footer .btn-group .btn {
            flex: 1;
        }
        .product-footer .btn-group .card-cart-btn {
            flex: 0.8;
        }
        
        @media (max-width: 768px) {
            .product-footer .btn-group {
                flex-direction: column;
                gap: 0.3rem;
            }
            .product-footer .btn-group .btn,
            .product-footer .btn-group .card-cart-btn {
                flex: none;
                width: 100%;
            }
            .card-wishlist-btn {
                width: 28px;
                height: 28px;
                font-size: 0.7rem;
                top: 0.4rem;
                right: 0.4rem;
            }
        }

    <!-- Cart & Wishlist Logic -->
    <script type="module">
        import { showToast } from '/store/js/app.js';
        
        const CART_KEY = 'jeenash_cart';
        const WISHLIST_KEY = 'jeenash_wishlist';
        
        function getCart() {
            try { return JSON.parse(localStorage.getItem(CART_KEY)) || []; }
            catch { return []; }
        }
        
        function saveCart(cart) {
            localStorage.setItem(CART_KEY, JSON.stringify(cart));
            updateCartIndicator();
        }
        
        function addToCart(product) {
            if (!product || !product.id) return false;
            const cart = getCart();
            const existing = cart.find(item => item.id === product.id);
            if (existing) {
                showToast('Already in cart!', 'info');
                return false;
            }
            cart.push({
                id: product.id,
                title: product.title || 'Untitled',
                price: product.price || 0,
                image: product.imageUrl || '/store/assets/images/placeholder.jpg',
                category: product.category || 'Product',
                quantity: 1
            });
            saveCart(cart);
            showToast('Added to cart! 🛒', 'success');
            return true;
        }
        
        function getCartCount() { return getCart().length; }
        
        function updateCartIndicator() {
            const indicator = document.getElementById('cart-indicator');
            const badge = document.getElementById('cart-count-badge');
            if (!indicator || !badge) return;
            const count = getCartCount();
            if (count > 0) {
                indicator.style.display = 'inline-flex';
                badge.style.display = 'inline-flex';
                badge.textContent = count;
            } else {
                indicator.style.display = 'none';
                badge.style.display = 'none';
            }
        }
        
        function getWishlist() {
            try { return JSON.parse(localStorage.getItem(WISHLIST_KEY)) || []; }
            catch { return []; }
        }
        
        function saveWishlist(wishlist) {
            localStorage.setItem(WISHLIST_KEY, JSON.stringify(wishlist));
        }
        
        function toggleWishlist(productId) {
            if (!productId) return false;
            const wishlist = getWishlist();
            const index = wishlist.indexOf(productId);
            if (index > -1) {
                wishlist.splice(index, 1);
                saveWishlist(wishlist);
                showToast('Removed from wishlist', 'info');
                return false;
            } else {
                wishlist.push(productId);
                saveWishlist(wishlist);
                showToast('Added to wishlist ❤️', 'success');
                return true;
            }
        }
        
        function isInWishlist(productId) {
            if (!productId) return false;
            return getWishlist().indexOf(productId) > -1;
        }

        document.addEventListener('DOMContentLoaded', () => {
            updateCartIndicator();
        });

        window.__cart = {
            addToCart, getCart, getCartCount, updateCartIndicator,
            isInWishlist, toggleWishlist, getWishlist
        };
        
        console.log('✅ Cart & Wishlist loaded on explore page');
    </script>
