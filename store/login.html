<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <meta name="description" content="Securely login or create an account on Jeenash Store to access your premium digital products, courses, and reels bundles instantly.">
    <meta name="keywords" content="Login, Signup, Jeenash Store, Digital Products Account, Creator Login">

    <!-- Stylesheets — ABSOLUTE PATH -->
    <link rel="stylesheet" href="/store/css/style.css">

    <style>
        .auth-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
            position: relative;
            overflow: hidden;
        }
        
        .auth-container {
            width: 100%;
            max-width: 420px;
            background: var(--bg-surface);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-glass);
            border-radius: var(--radius-lg);
            padding: 2.5rem 2rem;
            box-shadow: var(--shadow-lg);
            position: relative;
            z-index: 10;
            transition: var(--transition-smooth);
        }
        
        .auth-header {
            text-align: center;
            margin-bottom: 2rem;
        }
        
        .auth-header .brand-logo {
            justify-content: center;
            margin-bottom: 1rem;
            font-size: 1.75rem;
        }
        
        .auth-header h1 {
            font-size: 1.5rem;
            color: var(--text-main);
            margin-bottom: 0.25rem;
        }
        
        .auth-header p {
            color: var(--text-muted);
            font-size: 0.95rem;
        }
        
        .auth-tabs {
            display: flex;
            background: rgba(0, 0, 0, 0.25);
            border-radius: var(--radius-sm);
            padding: 4px;
            margin-bottom: 2rem;
        }
        
        .auth-tab {
            flex: 1;
            text-align: center;
            padding: 0.7rem;
            color: var(--text-muted);
            font-weight: 600;
            font-family: var(--font-body);
            font-size: 0.875rem;
            cursor: pointer;
            border-radius: var(--radius-sm);
            transition: var(--transition-fast);
            border: none;
            background: transparent;
        }
        
        .auth-tab.active {
            background: var(--bg-elevated);
            color: var(--text-main);
            box-shadow: var(--shadow-sm);
        }
        
        .auth-tab:hover:not(.active) {
            color: var(--text-main);
        }
        
        .auth-form {
            display: none;
            animation: fadeIn 0.3s ease forwards;
        }
        
        .auth-form.active {
            display: block;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .form-group {
            margin-bottom: 1.25rem;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.85rem;
            color: var(--text-muted);
            font-weight: 500;
        }
        
        .form-control {
            width: 100%;
            padding: 0.875rem 1rem;
            background: rgba(0, 0, 0, 0.25);
            border: 1px solid var(--border-glass);
            border-radius: var(--radius-sm);
            color: var(--text-main);
            font-family: var(--font-body);
            font-size: 0.95rem;
            transition: var(--transition-fast);
        }
        
        .form-control:focus {
            outline: none;
            border-color: var(--primary-light);
            box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.12);
        }
        
        .form-control::placeholder {
            color: rgba(255, 255, 255, 0.2);
        }
        
        .phone-input-wrap {
            display: flex;
            align-items: center;
            background: rgba(0, 0, 0, 0.25);
            border: 1px solid var(--border-glass);
            border-radius: var(--radius-sm);
            transition: var(--transition-fast);
            overflow: hidden;
        }
        
        .phone-input-wrap:focus-within {
            border-color: var(--primary-light);
            box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.12);
        }
        
        .phone-input-wrap .country-code {
            padding: 0.875rem 0.75rem 0.875rem 1rem;
            color: var(--text-muted);
            font-size: 0.95rem;
            font-weight: 600;
            background: rgba(0, 0, 0, 0.15);
            border-right: 1px solid var(--border-glass);
            user-select: none;
            white-space: nowrap;
        }
        
        .phone-input-wrap input {
            flex: 1;
            padding: 0.875rem 1rem;
            background: transparent;
            border: none;
            color: var(--text-main);
            font-family: var(--font-body);
            font-size: 0.95rem;
            outline: none;
            min-width: 0;
        }
        
        .phone-input-wrap input::placeholder {
            color: rgba(255, 255, 255, 0.2);
        }
        
        .phone-input-wrap input:-webkit-autofill,
        .phone-input-wrap input:-webkit-autofill:focus {
            -webkit-box-shadow: 0 0 0 1000px rgba(0, 0, 0, 0.25) inset;
            -webkit-text-fill-color: var(--text-main);
        }
        
        .btn-auth {
            width: 100%;
            padding: 0.9rem;
            font-size: 1rem;
            border-radius: var(--radius-sm);
            min-height: 50px;
            margin-top: 0.25rem;
            font-weight: 600;
        }
        
        .legal-check {
            display: flex;
            align-items: flex-start;
            gap: 0.75rem;
            margin: 1.25rem 0 1.5rem 0;
        }
        
        .legal-check input[type="checkbox"] {
            margin-top: 3px;
            accent-color: var(--primary-light);
            cursor: pointer;
            width: 18px;
            height: 18px;
            flex-shrink: 0;
        }
        
        .legal-check label {
            font-size: 0.8rem;
            color: var(--text-muted);
            line-height: 1.4;
            cursor: pointer;
        }
        
        .legal-check label a {
            color: var(--primary-light);
            transition: var(--transition-fast);
        }
        
        .legal-check label a:hover {
            color: var(--gold);
        }
        
        .back-to-store {
            display: block;
            text-align: center;
            margin-top: 1.5rem;
            color: var(--text-muted);
            font-size: 0.875rem;
            transition: var(--transition-fast);
        }
        
        .back-to-store:hover {
            color: var(--primary-light);
        }
        
        .back-to-store i {
            margin-right: 0.5rem;
        }
        
        @media (max-width: 480px) {
            .auth-container {
                padding: 1.75rem 1.25rem;
                border-radius: var(--radius-md);
                margin: 0.5rem;
            }
            
            .auth-header .brand-logo {
                font-size: 1.4rem;
            }
            
            .auth-header h1 {
                font-size: 1.25rem;
            }
            
            .auth-header p {
                font-size: 0.85rem;
            }
            
            .auth-tab {
                font-size: 0.8rem;
                padding: 0.6rem;
            }
            
            .form-control {
                padding: 0.75rem 0.875rem;
                font-size: 0.9rem;
            }
            
            .phone-input-wrap .country-code {
                padding: 0.75rem 0.6rem 0.75rem 0.875rem;
                font-size: 0.9rem;
            }
            
            .phone-input-wrap input {
                padding: 0.75rem 0.875rem;
                font-size: 0.9rem;
            }
            
            .btn-auth {
                font-size: 0.9rem;
                padding: 0.75rem;
                min-height: 46px;
            }
            
            .legal-check label {
                font-size: 0.75rem;
            }
            
            .back-to-store {
                font-size: 0.8rem;
            }
        }
    </style>

</head>
<body class="auth-page">
    <div class="bg-shape shape-1" aria-hidden="true"></div>
    <div class="bg-shape shape-2" aria-hidden="true"></div>

    <div class="auth-container">
        <div class="auth-header">
            <a href="/store/index.html" class="brand-logo" aria-label="Jeenash Store Home">
                <span class="logo-icon"><i class="fa-solid fa-layer-group"></i></span>
                <span class="logo-text">JEENASH<span class="text-primary">STORE</span></span>
            </a>
            <h1 id="header-title">Welcome Back</h1>
            <p id="header-text">Please enter your details to continue.</p>
        </div>

        <div class="auth-tabs" role="tablist">
            <button class="auth-tab active" data-target="login-form" role="tab" aria-selected="true">Login</button>
            <button class="auth-tab" data-target="register-form" role="tab" aria-selected="false">Sign Up</button>
        </div>

        <!-- Login Form -->
        <form id="login-form" class="auth-form active" aria-label="Login form">
            <div class="form-group">
                <label for="login-email">Email Address</label>
                <input type="email" id="login-email" class="form-control" required placeholder="name@example.com" autocomplete="email">
            </div>
            <div class="form-group">
                <label for="login-password">Password</label>
                <input type="password" id="login-password" class="form-control" required placeholder="••••••••" autocomplete="current-password">
            </div>
            <button type="submit" class="btn btn-primary btn-auth glow-effect" id="login-btn">
                Sign In <i class="fa-solid fa-right-to-bracket" aria-hidden="true"></i>
            </button>
        </form>

        <!-- Register Form -->
        <form id="register-form" class="auth-form" aria-label="Registration form">
            <div class="form-group">
                <label for="reg-name">Full Name</label>
                <input type="text" id="reg-name" class="form-control" required placeholder="John Doe" autocomplete="name">
            </div>
            <div class="form-group">
                <label for="reg-email">Email Address</label>
                <input type="email" id="reg-email" class="form-control" required placeholder="name@example.com" autocomplete="email">
            </div>
            
            <div class="form-group">
                <label for="reg-phone">Phone Number</label>
                <div class="phone-input-wrap">
                    <span class="country-code">+91</span>
                    <input 
                        type="tel" 
                        id="reg-phone" 
                        name="phone" 
                        required 
                        placeholder="9876543210" 
                        pattern="[0-9]{10}" 
                        maxlength="10" 
                        inputmode="numeric"
                        autocomplete="tel-national"
                        title="Please enter a valid 10-digit mobile number"
                    >
                </div>
            </div>
            
            <div class="form-group">
                <label for="reg-password">Password</label>
                <input type="password" id="reg-password" class="form-control" required placeholder="Min. 6 characters" autocomplete="new-password">
            </div>
            
            <div class="legal-check">
                <input type="checkbox" id="reg-terms" required>
                <label for="reg-terms">
                    I agree to the <a href="/store/terms.html" target="_blank">Terms</a>, 
                    <a href="/store/privacy.html" target="_blank">Privacy</a> &amp; 
                    <a href="/store/refund.html" target="_blank">Refund Policy</a>.
                </label>
            </div>

            <button type="submit" class="btn btn-primary btn-auth glow-effect" id="reg-btn">
                Create Account <i class="fa-solid fa-user-plus" aria-hidden="true"></i>
            </button>
        </form>

        <a href="/store/index.html" class="back-to-store"><i class="fa-solid fa-arrow-left" aria-hidden="true"></i> Back to Store</a>
    </div>

    <!-- FAST UI TAB LOGIC -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const tabs = document.querySelectorAll('.auth-tab');
            const forms = document.querySelectorAll('.auth-form');
            const headerTitle = document.getElementById('header-title');
            const headerText = document.getElementById('header-text');

            tabs.forEach(tab => {
                tab.addEventListener('click', () => {
                    tabs.forEach(t => {
                        t.classList.remove('active');
                        t.setAttribute('aria-selected', 'false');
                    });
                    forms.forEach(f => f.classList.remove('active'));

                    tab.classList.add('active');
                    tab.setAttribute('aria-selected', 'true');
                    const targetId = tab.getAttribute('data-target');
                    document.getElementById(targetId).classList.add('active');
                    
                    if(targetId === 'login-form') {
                        headerTitle.textContent = 'Welcome Back';
                        headerText.textContent = 'Please enter your details to continue.';
                    } else {
                        headerTitle.textContent = 'Create Account';
                        headerText.textContent = 'Join Jeenash Store to access premium digital products.';
                    }
                });
            });

            const phoneInput = document.getElementById('reg-phone');
            if (phoneInput) {
                phoneInput.addEventListener('input', (e) => {
                    e.target.value = e.target.value.replace(/\D/g, '').slice(0, 10);
                });
            }
        });
    </script>

    <!-- Firebase Configuration & Backend Logic — ABSOLUTE PATHS -->
    <script type="module" src="/store/config/firebase.js"></script>
    <script type="module" src="/store/js/app.js"></script>
    
    <script type="module">
        import { loginUser, registerUser, getCurrentUser, ADMIN_EMAIL } from '/store/js/auth.js';
        import { showToast } from '/store/js/app.js';

        setTimeout(() => {
            const user = getCurrentUser();
            if (user) {
                if (user.email.toLowerCase() === ADMIN_EMAIL.toLowerCase()) {
                    window.location.href = '/store/admin.html';
                } else {
                    window.location.href = '/store/dashboard.html';
                }
            }
        }, 1000); 

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;
            const btn = document.getElementById('login-btn');
            
            const originalHtml = btn.innerHTML;
            btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin" aria-hidden="true"></i> Authenticating...';
            btn.disabled = true;

            const result = await loginUser(email, password);

            if (result.success) {
                showToast('Login successful!', 'success');
                if (result.user.email.toLowerCase() !== ADMIN_EMAIL.toLowerCase()) {
                    window.location.href = '/store/dashboard.html';
                }
            } else {
                showToast(result.error, 'error');
                btn.innerHTML = originalHtml;
                btn.disabled = false;
            }
        });

        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('reg-name').value.trim();
            const email = document.getElementById('reg-email').value.trim();
            const phone = document.getElementById('reg-phone').value.trim();
            const password = document.getElementById('reg-password').value;
            const btn = document.getElementById('reg-btn');
            
            if (!phone || phone.length !== 10 || !/^\d{10}$/.test(phone)) {
                showToast('Please enter a valid 10-digit phone number.', 'error');
                return;
            }
            
            const originalHtml = btn.innerHTML;
            btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin" aria-hidden="true"></i> Creating...';
            btn.disabled = true;

            const result = await registerUser(name, email, password, phone);

            if (result.success) {
                showToast('Account created successfully!', 'success');
                setTimeout(() => window.location.href = '/store/dashboard.html', 1000);
            } else {
                showToast(result.error, 'error');
                btn.innerHTML = originalHtml;
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
